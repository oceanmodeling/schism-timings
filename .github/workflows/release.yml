name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux-amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o schism-timings-linux-amd64 .

      - name: Generate checksum
        run: sha256sum schism-timings-linux-amd64 > schism-timings-linux-amd64.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" schism-timings-linux-amd64 schism-timings-linux-amd64.sha256 --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}" --verify-tag

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: ^(go\.mod|go\.sum|.*\.go)$

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: ^(go\.mod|go\.sum|.*\.go)$

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        files: ^(go\.mod|go\.sum|.*\.go|testdata/.*)$
